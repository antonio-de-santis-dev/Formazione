version: '3.7'

services:

  docker-springboot-helloworld-2:
    image: programmingacademydotit/docker-springboot-helloworld-2:0.0.2-SNAPSHOT
    mem_limit: 700m
    ports:
      - "8081:8081"
    networks:
      - prova-network
    depends_on:
      - naming-server
    environment:
      EUREKA.CLIENT.SERVICEURL.DEFAULTZONE: http://naming-server:8761/eureka

  naming-server:
    image: programmingacademydotit/docker-compose-eurekaserver-1:0.0.1-SNAPSHOT
    mem_limit: 700m
    ports:
      - "8761:8761"
    networks:
      - prova-network

networks:
  prova-network: